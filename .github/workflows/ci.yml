# Integración continua.
#
# En cada push y pull request: lint, tipos, pruebas (incluidas las de base de
# datos con Postgres embebido) y compilación. No necesita ningún secreto.
#
# El despliegue lo hace la integración de Vercel con GitHub: cada push a main
# compila y publica; si la compilación falla, no se publica. Las migraciones de
# base de datos se aplican desde el computador con `npx supabase db push`.
#
# Opcional: para que las migraciones se apliquen también desde aquí, crea la
# variable de repositorio MIGRAR_DESDE_ACTIONS=true y los secretos
# SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF y SUPABASE_DB_PASSWORD.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Valores públicos del proyecto (la clave «publishable» es segura en el código).
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://tklopxvtbwzdgseacqyw.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_VKktmSYVsPQ8Egf0hox2zw_UREyov6g' }}

jobs:
  verificar:
    name: Lint, tipos, pruebas y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen && npm run typecheck
      - run: npm test
      - run: npm run build

  migrar:
    name: Aplicar migraciones en Supabase (opcional)
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.MIGRAR_DESDE_ACTIONS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
