# Evita que Supabase pause el proyecto gratuito por inactividad.
#
# Supabase pausa los proyectos del plan gratuito tras 7 días con pocas
# consultas (https://supabase.com/docs/guides/platform/free-project-pausing).
# Esta tarea hace una consulta mínima a la base de datos los lunes y jueves,
# de modo que nunca pasen 7 días sin actividad aunque nadie use la app.
#
# No necesita secretos: usa la URL y la clave pública del proyecto. Si existe el
# secreto SUPABASE_SERVICE_ROLE_KEY, además purga la papelera (respaldo de pg_cron).

name: Mantener activo Supabase

on:
  schedule:
    - cron: "17 9 * * 1,4" # lunes y jueves 09:17 UTC (04:17 en Bogotá)
  workflow_dispatch:

env:
  URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://tklopxvtbwzdgseacqyw.supabase.co' }}
  CLAVE: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_VKktmSYVsPQ8Egf0hox2zw_UREyov6g' }}

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consulta mínima a la base de datos
        run: |
          set -e
          codigo=$(curl -s -o /tmp/respuesta.txt -w "%{http_code}" \
            -H "apikey: $CLAVE" -H "Authorization: Bearer $CLAVE" \
            "$URL/rest/v1/catalogo_publico?select=id&limit=1")
          echo "Respuesta HTTP: $codigo"
          cat /tmp/respuesta.txt; echo
          test "$codigo" = "200"
      - name: Purgar papelera (mayor de 30 días)
        if: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          SERVICIO: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -s -X POST -H "apikey: $SERVICIO" -H "Authorization: Bearer $SERVICIO" \
            -H "Content-Type: application/json" -d '{"dias":30}' \
            "$URL/rest/v1/rpc/purgar_papelera"; echo
