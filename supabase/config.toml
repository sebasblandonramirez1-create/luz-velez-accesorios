# Configuración del proyecto alojado que se sincroniza con `supabase config push`.
# Solo se declara lo que se quiere gestionar desde el repositorio; lo demás se
# deja como esté en el panel. (La plantilla completa para desarrollo local con
# Docker no se usa en este proyecto.)
project_id = "luz-velez-accesorios"

[auth]
site_url = "https://luzazul-accesorios.vercel.app"
additional_redirect_urls = [
  "https://luzazul-accesorios.vercel.app/auth/callback",
  "https://luzazul-accesorios.vercel.app/**",
  # Dirección anterior: se conserva mientras Vercel termina el cambio de nombre.
  "https://luz-velez-accesorios.vercel.app/auth/callback",
  "https://luz-velez-accesorios.vercel.app/**",
  "http://localhost:3000/auth/callback",
]
